name: Compilar APK Ulinux

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar o repositório
      uses: actions/checkout@v4

    - name: Instalar o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Configurar o Java (Necessário para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Criar estrutura inicial do Capacitor
      run: |
        echo '{"appId":"com.ulinux.ofertas","appName":"Ulinux Ofertas","webDir":"www"}' > capacitor.config.json

    - name: Instalar Dependências Gerais
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Criar e Configurar Projeto Android Nativo
      run: |
        npx cap add android
        npx cap sync

    - name: Dar Permissão ao Compilador (Gradle)
      run: |
        cd android
        chmod +x gradlew

    - name: Compilar o APK Oficial
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Disponibilizar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: ulinux-ofertas-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
